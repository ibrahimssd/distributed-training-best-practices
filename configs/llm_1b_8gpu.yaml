model:
  name: "facebook/opt-1.3b"
  max_seq_length: 2048

training:
  task_type: "causal_lm"
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  num_epochs: 1
  steps_per_epoch: 2000
  mixed_precision: "bf16"
  gradient_checkpointing: true
  log_interval: 10
  save_interval: 1

data:
  dataset_size: 20000
  num_workers: 8
  val_split_ratio: 0.1

distributed:
  backend: "nccl"
  nccl_socket_ifname: "ib0"
  nccl_ib_disable: 0
