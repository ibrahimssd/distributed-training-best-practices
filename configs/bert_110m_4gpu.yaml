model:
  name: "bert-base-uncased"
  max_seq_length: 512

training:
  task_type: "masked_lm"
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 2e-5
  num_epochs: 3
  steps_per_epoch: 1000
  mixed_precision: "bf16"
  gradient_checkpointing: false
  log_interval: 10
  save_interval: 1

data:
  dataset_size: 10000
  num_workers: 8
  val_split_ratio: 0.1

distributed:
  backend: "nccl"
  nccl_socket_ifname: "ib0"
  nccl_ib_disable: 0
