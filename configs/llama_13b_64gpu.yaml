model:
  name: "meta-llama/Llama-2-13b-hf"
  max_seq_length: 4096

training:
  task_type: "causal_lm"
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1e-4
  num_epochs: 1
  steps_per_epoch: 4000
  mixed_precision: "bf16"
  gradient_checkpointing: true
  log_interval: 5
  save_interval: 1

data:
  dataset_size: 40000
  num_workers: 16
  val_split_ratio: 0.1

distributed:
  backend: "nccl"
  nccl_socket_ifname: "ib0"
  nccl_ib_disable: 0

fsdp:
  sharding_strategy: "FULL_SHARD"
